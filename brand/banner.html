<!doctype html>
<!-- The README banner. Rendered to PNG by brand/build.sh: a raster survives
     every reader, and GitHub will not run the @font-face an SVG would need. -->
<meta charset="utf-8">
<style>
  @font-face{font-family:"Source Serif 4";src:url(../ui/fonts/serif-600.woff2)format("woff2");font-weight:600}
  @font-face{font-family:"IBM Plex Mono";src:url(../ui/fonts/mono-400.woff2)format("woff2");font-weight:400}
  :root{
    --paper:#fbfaf7; --ink:#181e24; --ink-2:#525960; --ink-3:#676c73;
    --rule:#d4d8dd; --blue:#0072a8; --green:#187c49; --red:#cf3100;
  }
  body.dark{
    --paper:#101419; --ink:#e9e8e2; --ink-2:#a6abb1; --ink-3:#7b8187;
    --rule:#292e35; --blue:#008bc2; --green:#34925d; --red:#dd5230;
  }
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:360px;background:var(--paper);color:var(--ink);
       font:16px/1.5 "Source Serif 4",Georgia,serif;display:flex;flex-direction:column;
       justify-content:center;padding:0 76px;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:22px;margin-left:-14px}
  .top img{width:108px;height:108px;flex:none}
  h1{margin:0;font-size:62px;font-weight:600;letter-spacing:-0.028em;line-height:1}
  p{margin:20px 0 0 2px;font-size:27px;line-height:1.34;color:var(--ink-2);
    letter-spacing:-0.012em}
  p b{color:var(--ink);font-weight:600}
  .ladder{position:absolute;right:76px;top:0;height:360px;display:flex;flex-direction:column;
          justify-content:center;gap:0}
  .r{display:grid;grid-template-columns:5px 1fr;gap:0 18px;align-items:baseline;
     padding:15px 0;border-bottom:1px solid var(--rule);width:404px}
  .r:last-child{border-bottom:0}
  .r i{display:block;width:5px;height:34px;border-radius:1px}
  .r .w{font-family:"IBM Plex Mono",monospace;font-size:14.5px;color:var(--ink-2)}
  .r .w b{display:block;font-family:"Source Serif 4",serif;font-size:19px;color:var(--ink);
          font-weight:600;letter-spacing:-0.01em;margin-bottom:2px}
  .r.no .w b{color:var(--red)}
</style>
<body>
  <div class="top">
    <img id="mark" src="concord-mark-color.svg" alt="">
    <h1>Concord</h1>
  </div>
  <p>An agent that tells you<br><b>what it cannot take back</b>,<br>before it acts.</p>
  <div class="ladder">
    <div class="r"><i style="background:var(--blue)"></i>
      <span class="w"><b>Can be cancelled</b>reserve · confirm · cancel</span></div>
    <div class="r"><i style="background:var(--green)"></i>
      <span class="w"><b>Can be refunded</b>execute · compensate</span></div>
    <div class="r no"><i style="background:var(--red)"></i>
      <span class="w"><b>Cannot be taken back</b>execute</span></div>
  </div>
</body>
